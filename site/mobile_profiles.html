<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profiles — Mobile View</title>
  <script>
  (function(){
    try{
      const parts = location.pathname.split('/').filter(Boolean);
      const project = (location.hostname && location.hostname.endsWith('github.io') && parts.length>0) ? ('/' + parts[0] + '/') : '/';
      window.PROJECT_BASE = project;
      if(location.hostname && location.hostname.endsWith('github.io')){
        document.querySelectorAll('link[href], script[src], img[src]').forEach(el=>{ ['href','src'].forEach(a=>{ if(el.hasAttribute(a)){ const v=el.getAttribute(a); if(v && v.startsWith('/') && !v.startsWith('//')) el.setAttribute(a, project + v.replace(/^\/+/,'')); }}); });
      }
    }catch(e){}
  })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile_styles.css">
</head>
<body>
  <header>
    <div class="branding">
      <div class="logo"><img src="logo.png" alt="logo"/></div>
      <div class="title">
        <h1>The White Noise</h1>
        <div class="subtitle">Mobile profiles</div>
      </div>
    </div>
    <div class="controls">
      <!-- top nav (above search) -->
      <div class="controls mobile-nav-wrap top-nav">
        <nav class="nav-links">
          <a href="mobile_profiles.html">Profiles</a>
          <a href="mobile_groups.html">Groups</a>
          <a href="mobile_dashboard.html">Stats</a>
          <a href="index.html">Home</a>
        </nav>
      </div>
      <div class="page-controls">
          <input id="search" placeholder="Search profiles" />
          <button id="clear">Clear</button>
          <button id="showAll">Show all</button>
        </div>
    </div>
    
  </header>

  <main>
    <aside id="results">
      <button id="mobileFilterToggle" class="filter-toggle">Show filters</button>
      <div id="filters"></div>
      <div id="resultsCount"></div>
      <ul id="list"></ul>
    </aside>

    <section id="detail">
      <div id="detailInner">
        <div id="detailHeader"><h2 id="detailName"></h2><div id="detailMeta"></div></div>
        <div id="gallery"></div>
        <div id="fields"></div>
        <div id="groups"></div>
        <div id="messages"></div>
      </div>
    </section>
  </main>

  <template id="listItemTpl">
    <li class="item">
      <img class="thumb" src="" alt="thumb"/>
      <div class="meta">
        <div class="title"></div>
        <div class="sub"></div>
      </div>
    </li>
  </template>

  <script>
    // Ensure app.js will look for profiles.json at repo root when served from /site/
    try{ window.PROJECT_BASE = window.PROJECT_BASE || '/'; }catch(e){}
  </script>
  <script src="app.js"></script>
  <script>
    // small mobile helper: toggle filters area created by app.js
    document.addEventListener('DOMContentLoaded', ()=>{
      const btn = document.getElementById('mobileFilterToggle');
      const filters = document.getElementById('filters');
      if(!filters || !btn) return;
      // start collapsed
      filters.classList.add('mobile-collapsed');
      btn.addEventListener('click', ()=>{
        const hidden = filters.classList.toggle('mobile-collapsed');
        btn.textContent = hidden ? 'Show filters' : 'Hide filters';
      });
    });
  </script>
  <script src="mobile_switch.js"></script>
</body>
</html>
