<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Groups — Mobile View</title>
  <script>
  (function(){
    try{ const parts = location.pathname.split('/').filter(Boolean); const project = (location.hostname && location.hostname.endsWith('github.io') && parts.length>0) ? ('/' + parts[0] + '/') : '/'; window.PROJECT_BASE = project; if(location.hostname && location.hostname.endsWith('github.io')){ document.querySelectorAll('link[href], script[src], img[src]').forEach(el=>{ ['href','src'].forEach(a=>{ if(el.hasAttribute(a)){ const v=el.getAttribute(a); if(v && v.startsWith('/') && !v.startsWith('//')) el.setAttribute(a, project + v.replace(/^\/+/,'')); }}); }); } }catch(e){}
  })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile_styles.css">
</head>
<body>
  <header>
    <div class="branding">
      <div class="logo"><img src="logo.png" alt="logo"/></div>
      <div class="title">
        <h1>The White Noise</h1>
        <div class="subtitle">Mobile groups</div>
      </div>
    </div>
    <div class="controls">
      <!-- top nav (above search) -->
      <div class="controls mobile-nav-wrap top-nav">
        <nav class="nav-links">
          <a href="mobile_profiles.html">Profiles</a>
          <a href="mobile_groups.html">Groups</a>
          <a href="mobile_dashboard.html">Stats</a>
          <a href="index.html">Home</a>
        </nav>
      </div>
      <div class="page-controls">
        <input id="search" placeholder="Search groups" />
        <button id="clear">Clear</button>
      </div>
    </div>
    
  </header>

  <main>
    <aside id="results">
      <div id="resultsCount"></div>
      <ul id="list"></ul>
    </aside>
    <section id="detail">
      <div id="detailInner">
        <div id="detailHeader"><h2 id="detailName"></h2><div id="detailMeta"></div></div>
        <div id="groupImage"></div>
        <div id="groupHeader" style="margin-top:12px"></div>
        <div id="groupInfo" style="margin-top:12px"></div>
        <h3 style="margin-top:18px">Topics</h3>
        <div id="topics" class="topic-list"></div>
        <h3 style="margin-top:18px">Members</h3>
        <div id="groupMembers" style="margin-top:8px"></div>
      </div>
    </section>
  </main>

  <template id="listItemTpl">
    <li class="item">
      <img class="thumb" src="" alt="thumb"/>
      <div class="meta">
        <div class="title"></div>
        <div class="sub"></div>
      </div>
    </li>
  </template>

  <script src="groups.js"></script>
  <script>
    // minor mobile tweak: enlarge search input touch area
    document.addEventListener('DOMContentLoaded', ()=>{
      const s = document.getElementById('search'); if(s) s.style.padding = '12px';
    });
  </script>
  <script src="mobile_switch.js"></script>
</body>
</html>
